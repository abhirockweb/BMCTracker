
name: Build and Test BMCTracker APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Default permissions: read-only
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android project
        run: |
          test -f gradlew || {
            echo "ERROR: gradlew not found in repository root."
            exit 1
          }

          test -d app || {
            echo "ERROR: app directory not found."
            exit 1
          }

          chmod +x gradlew

      - name: Build APK and run unit tests
        run: |
          ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules

          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test app on Android 10 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -eu

            mkdir -p /tmp/bmc-test-logs

            # Always preserve emulator logs, including on failure.
            trap '
              adb logcat -d -v threadtime \
                > /tmp/bmc-test-logs/logcat.txt 2>&1 || true
              adb shell dumpsys activity activities \
                > /tmp/bmc-test-logs/activities.txt 2>&1 || true
            ' EXIT

            APK="app/build/outputs/apk/debug/app-debug.apk"
            PACKAGE="com.bmc.tracker"

            test -f "$APK" || {
              echo "ERROR: APK was not generated."
              exit 1
            }

            adb logcat -c
            adb install -r "$APK"

            # Fail if Android cannot launch the requested activity.
            adb shell am start -W -n \
              "$PACKAGE/.MainActivity"

            # Wait up to 30 seconds for the application process.
            APP_RUNNING="false"

            for i in $(seq 1 15); do
              if adb shell pidof "$PACKAGE" >/dev/null 2>&1; then
                APP_RUNNING="true"
                break
              fi
              sleep 2
            done

            if [ "$APP_RUNNING" != "true" ]; then
              echo "ERROR: App process did not start."
              exit 1
            fi

            # Check that the app remains alive after startup.
            sleep 10

            if ! adb shell pidof "$PACKAGE" >/dev/null 2>&1; then
              echo "ERROR: App crashed or exited after startup."
              exit 1
            fi

            echo "PASS: App process remained alive after startup."

      - name: Upload APK and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BMCTracker-Build-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            /tmp/bmc-test-logs/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish tested APK
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 10

    # Only this job can publish repository releases.
    permissions:
      contents: write

    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: BMCTracker-Build-${{ github.run_number }}
          path: dist

      - name: Verify APK exists
        run: |
          test -f dist/app/build/outputs/apk/debug/app-debug.apk || {
            echo "ERROR: Tested APK was not found."
            exit 1
          }

          mkdir -p release
          cp dist/app/build/outputs/apk/debug/app-debug.apk \
            release/BMCTracker.apk

          sha256sum release/BMCTracker.apk \
            > release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          TAG="apk-${RUN_ID}-${RUN_ATTEMPT}"

          gh release create "$TAG" \
            release/BMCTracker.apk \
            release/SHA256SUMS.txt \
            --title "BMCTracker APK - Build ${RUN_ID}" \
            --notes "Automated debug APK. Build and configured emulator startup checks passed.

          File: BMCTracker.apk
          Build run: ${RUN_ID}
          Run attempt: ${RUN_ATTEMPT}

          This is a DEBUG build for testing, not a signed production release.

          SHA-256 checksum is provided in SHA256SUMS.txt."
