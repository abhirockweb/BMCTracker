name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download source
        run: |
          curl -L -o /tmp/bmc.zip "https://muse.ai/files/1237082279498569/976413215514281/uzow0nf65iq0xaoaemejx99n/BMCTracker.zip"
          unzip -q /tmp/bmc.zip -d /tmp/src
          ls /tmp/src/bmc-tracker

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: /tmp/src/bmc-tracker
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test-run app on Android 10 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r /tmp/src/bmc-tracker/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.bmc.tracker/.MainActivity
            sleep 15
            adb shell pidof com.bmc.tracker && echo APP_STARTED_OK || echo APP_NOT_RUNNING
            adb logcat -d -v brief > /tmp/logcat-full.txt
            grep -i -E "bmc|FATAL EXCEPTION|AndroidRuntime|Process.*com.bmc" /tmp/logcat-full.txt | tail -n 300 > /tmp/logcat.txt || true
            adb shell pidof com.bmc.tracker

      - name: Report test log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head -c 10000 /tmp/logcat.txt > /tmp/log-tail.txt || echo "no app log captured" > /tmp/log-tail.txt
          gh issue create --title "Emulator crash log for run ${{ github.run_number }}" --body-file /tmp/log-tail.txt || true

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp /tmp/src/bmc-tracker/app/build/outputs/apk/debug/app-debug.apk ./BMCTracker.apk
          gh release create "apk-${{ github.run_number }}" ./BMCTracker.apk --title "BMC Tracker APK" --notes "Ready-to-install debug APK. Download BMCTracker.apk below and tap it to install."

      - name: Upload APK artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: BMCTracker-APK
          path: /tmp/src/bmc-tracker/app/build/outputs/apk/debug/app-debug.apk
