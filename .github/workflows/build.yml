
name: Build and Test BMCTracker APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download Android app source
        run: |
          set -eu

          mkdir -p /tmp/src

          curl --fail --location --silent --show-error \
            --retry 3 \
            -o /tmp/bmc.zip \
            "https://muse.ai/files/1237082279498569/1110726644901967/grorgo6tpl87tbhcr73gd0cm/BMCTracker.zip"

          unzip -q /tmp/bmc.zip -d /tmp/src

          echo "Checking downloaded project..."
          test -d /tmp/src/bmc-tracker/app
          test -f /tmp/src/bmc-tracker/settings.gradle -o \
               -f /tmp/src/bmc-tracker/settings.gradle.kts

          ls -la /tmp/src/bmc-tracker

      - name: Build APK and run unit tests
        working-directory: /tmp/src/bmc-tracker
        run: |
          set -eu

          gradle assembleDebug testDebugUnitTest \
            --no-daemon --stacktrace

          test -f app/build/outputs/apk/debug/app-debug.apk

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$GITHUB_WORKSPACE/dist/BMCTracker.apk"

      - name: Prepare emulator logs
        run: mkdir -p bmc-test-logs

      - name: Test app on Android 10 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -eu

            APK="/tmp/src/bmc-tracker/app/build/outputs/apk/debug/app-debug.apk"
            PACKAGE="com.bmc.tracker"
            LOG_DIR="$GITHUB_WORKSPACE/bmc-test-logs"

            trap '
              adb logcat -d -v threadtime \
                > "$LOG_DIR/logcat.txt" 2>&1 || true
              adb shell dumpsys activity activities \
                > "$LOG_DIR/activities.txt" 2>&1 || true
            ' EXIT

            adb logcat -c
            adb install -r "$APK"

            adb shell am start -W \
              -n "$PACKAGE/.MainActivity"

            APP_RUNNING=false

            for i in $(seq 1 15); do
              if adb shell pidof "$PACKAGE" >/dev/null 2>&1; then
                APP_RUNNING=true
                break
              fi
              sleep 2
            done

            if [ "$APP_RUNNING" != true ]; then
              echo "ERROR: App process did not start."
              exit 1
            fi

            sleep 10

            if ! adb shell pidof "$PACKAGE" >/dev/null 2>&1; then
              echo "ERROR: App crashed or exited after startup."
              exit 1
            fi

            echo "PASS: App remained running after startup."

      - name: Calculate APK checksum
        if: success()
        run: |
          cd dist
          sha256sum BMCTracker.apk > SHA256SUMS.txt

      - name: Upload APK and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BMCTracker-Build-${{ github.run_number }}
          path: |
            dist/
            bmc-test-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish APK to GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          TAG="apk-${RUN_ID}-${RUN_ATTEMPT}"

          gh release create "$TAG" \
            dist/BMCTracker.apk \
            dist/SHA256SUMS.txt \
            --title "BMCTracker APK - Build ${RUN_ID}" \
            --notes "Automated DEBUG APK. Build and emulator startup checks passed.

          Download BMCTracker.apk to install for testing.
          SHA-256 checksum is included in SHA256SUMS.txt.
          This is a debug build, not a production-signed release."
